<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Оставьте заявку на прохождение квеста в QuestRoom.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">QuestRoom</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" aria-current="page" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Дополнительно
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="index.html#about">О нас</a></li>
              <li><a class="dropdown-item" href="index.html#contacts">Контакты</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Главная</a></li>
        <li class="breadcrumb-item active" aria-current="page">Заявка</li>
      </ol>
    </nav>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Форма заявки</h1>
          </div>
          <div class="card-body">
            <div class="alert alert-info" role="alert">
              Заполните форму. Поля со звёздочкой обязательны.
            </div>

            <form id="order-form" novalidate>
              <div class="row g-3">

                <div class="col-12 col-md-6">
                  <label for="order-name" class="form-label">Имя *</label>
                  <input id="order-name" name="name" type="text" class="form-control" required>
                </div>

                <div class="col-12 col-md-6">
                  <label for="order-email" class="form-label">E-mail *</label>
                  <input id="order-email" name="email" type="email" class="form-control" required>
                </div>

                <div class="col-12 col-md-6">
                <label for="order-phone" class="form-label">Телефон *</label>
                <div class="input-group">
                  <span class="input-group-text">+7</span>
                  <input 
                    id="order-phone" 
                    name="phone" 
                    type="tel" 
                    class="form-control" 
                    placeholder="900 000-00-00"
                    pattern="\d{3}\s?\d{3}-?\d{2}-?\d{2}"
                    maxlength="14"
                    required
                  >
                </div>
                <div class="invalid-feedback">
                  Введите телефон в формате 900 000-00-00
                </div>
              </div>

                <div class="col-12 col-md-6">
                  <label for="order-quest" class="form-label">Квест</label>
                  <select id="order-quest" name="quest" class="form-select">
                    <option selected>Выберите квест</option>
                    <option value="lab">Побег из лаборатории</option>
                    <option value="mansion">Тайна старого особняка</option>
                    <option value="space">Космический рейс</option>
                    <option value="camp">Заброшенный лагерь</option>
                    <option value="bank">Ограбление банка</option>
                    <option value="pirate">Пиратский остров</option>
                  </select>
                </div>

                <div class="col-12 col-md-6">
                  <label for="order-date" class="form-label">Дата</label>
                  <input id="order-date" name="date" type="date" class="form-control">
                </div>

                <div class="col-12 col-md-6">
                  <label for="order-players" class="form-label">Количество игроков</label>
                  <select id="order-players" name="players" class="form-select">
                    <option selected>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="order-comment" class="form-label">Комментарий</label>
                  <textarea id="order-comment" name="comment" class="form-control" rows="4"></textarea>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">Я согласен на обработку данных *</label>
                  </div>
                </div>

                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Отправить заявку</button>
                  <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                </div>

              </div>
            </form>

            </div>
        </div>
      </div>
    </div>
</main>

  <footer class="bg-dark text-white py-4 mt-5">
      <div class="container">
      <p class="mb-0 text-center">&copy; 2026 QuestRoom</p>
      </div>
  </footer>

        id="backToTop" 
        style="bottom: 24px; right: 24px; width: 48px; height: 48px; display: none; z-index: 1050;"
        aria-label="Наверх">
    🧩
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/custom.js"></script>
</body>
</html>
